name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: ubuntu-24.04
            runner: ubuntu-24.04
          # Keep the protected macOS check name when updating the runner image.
          - check: macos-14
            runner: macos-15
          - check: windows-2022
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run verify:public
